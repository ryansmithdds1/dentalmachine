# Production-style stack: Postgres, Redis and two API servers behind any load balancer.
# Start: JWT_SECRET=... DOCUMENT_ENCRYPTION_KEY=... docker compose up --build --scale app=2
# For more than one app server, documents must live in shared object storage (set S3_* below).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dentalmachine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: dentalmachine
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, dentalmachine]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgres://dentalmachine:${POSTGRES_PASSWORD:-change-me}@postgres:5432/dentalmachine
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?set DOCUMENT_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:4000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes: [uploads:/data]
    ports: ['4000']
volumes:
  pgdata:
  uploads:
